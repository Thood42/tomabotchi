# tomabotchi server. Start it with bin/tomabotchi up, which sets TOMABOTCHI_ROOT (this folder) and
# DOCKER_GID, and reads .env (ANTHROPIC_API_KEY, optional TOMABOTCHI_PORT and OLLAMA_BASE_URL).
name: tomabotchi
services:
  tomabotchi:
    build: .
    image: tomabotchi-server:0.1.0
    restart: unless-stopped
    # Default docker bridge: the host firewall lets it reach Ollama on the host's :11434.
    network_mode: bridge
    ports:
      - 127.0.0.1:${TOMABOTCHI_PORT:-8770}:8770          # localhost only
    extra_hosts:
      - host.docker.internal:host-gateway
    # The Docker socket lets tomabotchi build pet homes and run one container per pet.
    # Pets never get it; it stays with the server.
    group_add:
      - "${DOCKER_GID}"
    environment:
      TOMABOTCHI_ROOT: ${TOMABOTCHI_ROOT}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # Mounted at the same absolute paths as on the host, so the bind mounts tomabotchi hands to
      # Docker for each pet (its workspace and brain home under data/pets/<id>/) resolve on the host.
      - ${TOMABOTCHI_ROOT}:${TOMABOTCHI_ROOT}:ro
      - ${TOMABOTCHI_ROOT}/data:${TOMABOTCHI_ROOT}/data
      - /var/run/docker.sock:/var/run/docker.sock

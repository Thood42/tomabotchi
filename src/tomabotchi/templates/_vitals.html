<section id="vitals-{{ pet.id }}" data-live class="sheet vitals" aria-label="Vitals">
  <h2>Vitals</h2>
  <dl style="margin-top: 12px">
    <dt>Hunger</dt><dd><span class="hearts" data-hearts="{{ vitals.hearts.hunger }}/4"></span><small>{{ "Has a task" if working else "Hungry for a task" }}</small></dd>
    <dt>Happy</dt><dd><span class="hearts" data-hearts="{{ vitals.hearts.happy }}/4"></span><small>Recent steps going {{ "well" if vitals.hearts.happy >= 3 else "badly" }}</small></dd>
    <dt>Energy</dt><dd><span class="hearts" data-hearts="{{ vitals.hearts.energy }}/4"></span><small>{{ vitals.energy_pct|round|int }}% of budget left</small></dd>
    <dt>Health</dt><dd><span class="hearts" data-hearts="{{ vitals.hearts.health }}/4"></span><small>{{ vitals.sick_reason or "No errors or loops" }}</small></dd>
  </dl>
</section>

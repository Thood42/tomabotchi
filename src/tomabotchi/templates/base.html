<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}tomabotchi{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ asset('kit.css') }}">
<link rel="stylesheet" href="{{ asset('app.css') }}">
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body{% block body_attrs %}{% endblock %}>
<div class="optin" role="region" aria-label="Notifications" hidden>
  <p><b>Let tomabotchi beep you?</b> When a pet calls, gets sick or runs out of budget while you're on another tab, your browser can tell you.</p>
  <div class="answers">
    <button class="btn primary" type="button" data-optin="ask">Allow notifications</button>
    <button class="btn quiet" type="button" data-optin="later">Not now</button>
  </div>
</div>
<header class="top">
  <a class="brand" href="/"><span class="lcd mini" data-scene="eggmini"></span>tomabotchi</a>
  <nav>
    {% block nav %}<a class="crumb" href="/">All pets</a>{% endblock %}
    <a class="crumb" href="/memory">Memory shelf</a>
    <a class="crumb" href="/settings">Settings</a>
    <a class="btn primary" href="/hatch">Hatch a pet</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<script src="{{ asset('kit.js') }}"></script>
<script src="{{ asset('app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>

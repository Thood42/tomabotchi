<div id="module-{{ pet.id }}" data-live class="mod" data-pet="{{ pet.id }}">
  <a class="hit" href="/pets/{{ pet.id }}" preload="mouseover" title="{{ doing }}">
    <span class="scr lcdbox"><span class="lcd" data-scene="{{ vitals.scene }}" data-seed="{{ pet.look_seed }}"></span></span>
    <span class="r1"><span class="n">{{ pet.name }}</span><span class="led {{ led }}"></span><span class="lbl k"></span></span>
    <span class="d">{{ doing }}</span>
    <span class="vus">{% for m in meters %}<span class="vu" title="{{ m.label }}: {{ m.text }}">{% for s in m.segs %}<i class="{{ s }}"></i>{% endfor %}</span>{% endfor %}</span>
  </a>
  {% if pet.state in ("awake", "asleep") %}
  {% set asleep = pet.state == "asleep" %}
  <button class="zz{{ ' on' if asleep }}" type="button" hx-post="/pets/{{ pet.id }}/lights" hx-vals='{"on": {{ 1 if asleep else 0 }}}' hx-swap="none"
          title="{{ 'Wake ' if asleep else 'Sleep ' }}{{ pet.name }}" aria-label="{{ 'Wake ' if asleep else 'Sleep ' }}{{ pet.name }}">
    {%- if asleep %}<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="currentColor"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6 13 13M3 13l1.4-1.4M11.6 4.4 13 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    {%- else %}<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 2.2A6 6 0 1 0 13.8 10 4.8 4.8 0 0 1 10.5 2.2Z" fill="currentColor"/></svg>{% endif -%}
  </button>
  {% endif %}
</div>
